name: Release checks
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '15 11 * * *'
permissions:
  contents: read
jobs:
  validate:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install browser tooling
        run: |
          npm ci --include=dev
          npx playwright install --with-deps chromium
      - name: Validate release
        run: |
          export CHROMIUM_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          node scripts/release-check.mjs "$RUNNER_TEMP/margin-release-evidence.json"
  anonymous-production-check:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Check anonymous access boundaries
        run: node --use-env-proxy scripts/check-production.mjs --anonymous
